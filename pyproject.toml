[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skill-lint"
version = "0.1.0"
description = "A linter for Agent Skills (SKILL.md) used by Claude Code, Cursor, Codex, and other coding agents."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "ws192" },
]
keywords = [
    "agent-skills",
    "skills",
    "linter",
    "claude-code",
    "cursor",
    "codex",
    "SKILL.md",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
skill-lint = "skill_lint.cli:entry"

[project.urls]
Homepage = "https://github.com/ws192/skill-lint"
Repository = "https://github.com/ws192/skill-lint"
Issues = "https://github.com/ws192/skill-lint/issues"
Documentation = "https://github.com/ws192/skill-lint#readme"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-q", "--strict-config"]
filterwarnings = ["error"]
